name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Once a day, so the site follows the releases of the programs (later also on their release).
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZOLA_VERSION: v0.23.6
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zola
        run: |
          archive="zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/${archive}"
          echo "${ZOLA_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C /usr/local/bin zola
          zola --version
      - name: Fetch the releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fetch-releases.sh
      - name: Fetch the examples
        run: scripts/fetch-examples.sh
      - name: Fetch the manuals and changes
        run: scripts/fetch-docs.sh
      - name: Build
        run: zola build
      - name: Check internal links
        run: zola check --skip-external-links
      - name: Size budget of the start page
        run: |
          # The start page with its stylesheet, upright font and hero image stays under 500 KB.
          size=$(du -cb public/index.html public/css/site.css public/fonts/InterVariable.woff2 \
            public/images/viktoriapark-training.webp | tail -1 | cut -f1)
          echo "start page: ${size} bytes"
          test "${size}" -lt 512000
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
